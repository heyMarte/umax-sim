<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Umax SIM 管理中心</title><link rel="icon" type="image/png" href="/static/umax-logo.png?v=061"><link rel="stylesheet" href="/static/style.css?v=061"><link rel="stylesheet" href="/static/custom-select.css?v=061"></head>
<body><section id="login" class="login-shell" hidden><div class="login-card"><img class="brand-mark brand-logo" src="/static/umax-logo.png?v=061" alt="Umax"><h1>Umax SIM 管理中心</h1><p>集中管理手机卡，及时接收验证码</p><form id="loginform"><label>账户<input name="username" required autocomplete="username" placeholder="输入你的账户"></label><label>密码<input name="password" type="password" required autocomplete="current-password" placeholder="输入密码"></label><p id="loginerror" class="form-error" role="alert"></p><button class="primary" type="submit">登录工作台</button></form><small>使用管理员或运营账户登录</small></div></section>
<div id="workspace" hidden><aside><div class="brand"><img class="brand-mark brand-logo" src="/static/umax-logo.png?v=061" alt="Umax"><div><strong>Umax SIM 管理中心</strong><small>手机卡管理工作台</small></div></div><nav id="nav" aria-label="主导航"></nav><div class="sidebar-note">号码有归属<br>验证码随时可查</div><footer id="identity"></footer></aside><main><header><div><h1 id="title">管理总览</h1><p id="subtitle">查看设备、号码与最新短信</p></div><div class="header-actions"><span id="syncstatus" class="sync-status" aria-live="polite">正在连接</span><button id="refresh" class="secondary">刷新</button></div></header><div id="error" class="error-banner" role="alert" hidden></div><section id="content" aria-label="工作区"><div class="empty">正在加载…</div></section></main></div><div id="toast" role="status" aria-live="polite" hidden></div><script type="module" src="/static/app.js?v=061"></script></body></html>
